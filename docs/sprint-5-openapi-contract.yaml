openapi: "3.0.3"
info:
  title: Hockey Ops Event Ingestion API
  version: "1.0.0"
  description: >
    Server-side endpoints for ingesting game events from external providers
    and accepting coach evaluation forms. Part of the Hockey Ops Player
    Directory application (Sprint 5).

servers:
  - url: /api
    description: TanStack Start server functions (Nitro)

paths:
  /events:
    post:
      operationId: ingestGameEvent
      summary: Ingest a single game event
      description: >
        Accepts a game event from an external provider. Uses a composite
        idempotency key (provider_id + provider_event_id) to prevent
        double-counting. Returns 200 if the exact same event was already
        stored, 409 if the key exists but the payload differs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameEventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameEventRecord"
        "200":
          description: Duplicate event (idempotent replay, same data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameEventRecord"
        "400":
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
        "409":
          description: Conflict -- idempotency key reused with different data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Idempotency conflict: key exists with different data"

  /evaluations:
    post:
      operationId: submitEvaluation
      summary: Submit a post-game player evaluation
      description: >
        Coaches submit a rating (1-5) and optional notes for a player
        after a game. The coach_id is derived from the authenticated session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationInput"
      responses:
        "201":
          description: Evaluation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRecord"
        "400":
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized

components:
  schemas:
    GameEventInput:
      type: object
      required:
        - provider_id
        - provider_event_id
        - game_id
        - event_type
        - period
      properties:
        provider_id:
          type: string
          description: Identifier for the external event provider
          example: "arena-tracker-1"
        provider_event_id:
          type: string
          description: Provider's own unique ID for this event
          example: "evt-2026-1102-0042"
        game_id:
          type: string
          format: uuid
          description: References the games table
        event_type:
          type: string
          enum: [goal, assist, penalty, save, shot]
        player_id:
          type: string
          format: uuid
          nullable: true
          description: References the players table (optional for team-level events)
        period:
          type: integer
          minimum: 1
          maximum: 4
        game_clock:
          type: string
          nullable: true
          description: Display clock value, e.g. "12:34"
        details:
          type: object
          nullable: true
          description: Provider-specific extra data
        provider_timestamp:
          type: string
          format: date-time
          nullable: true
          description: When the provider says the event occurred

    GameEventRecord:
      allOf:
        - $ref: "#/components/schemas/GameEventInput"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            idempotency_key:
              type: string
            received_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time

    EvaluationInput:
      type: object
      required:
        - game_id
        - player_id
        - rating
      properties:
        game_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        notes:
          type: string
          nullable: true

    EvaluationRecord:
      allOf:
        - $ref: "#/components/schemas/EvaluationInput"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            coach_id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: "game_id"
        message:
          type: string
          example: "game_id is required"

    ValidationErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
